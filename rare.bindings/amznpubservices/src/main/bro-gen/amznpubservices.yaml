functions:
    APSAdFormat(.*):
        class: APSAdFormat
        name: '#{g[0].downcase_first}'
    NSStringFromSlotType:
        class: DTBSlotGroup
        name: toString
    slotTypeFromCGSize:
        class: DTBSlotGroup
        name: fromCGSize
    APSParsing(.*):
        class: APSParsing
        name: '#{g[0].downcase_first}'


    # Make sure we don't miss any functions if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Function_#{g[0]}'

values:
    APS_ANALYTICS_(.*):
        class: APSAnalytics
        name: '#{g[0]}'
    DTBiOSSDKVersionNumber:
        class: DTBAds
        readonly: true
        name: getVersionNumber
    DTBiOSSDKVersionString:
        class: DTBAds
        readonly: true
        name: getVersionString
        marshaler: StringMarshalers.AsAsciiZMarshaler
        type: String
    (APSMraidVersion.*):
        class: APSInitConfig
        name: '#{g[0]}'
    APSErrorAdDomain:
        class: APSError
    FormatType_toString:
        exclude: true
    (kMraid.*):
        class: DTBMraidConstants

    # Make sure we don't miss any values if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Value_#{g[0]}'

constants:
    SWIFT_.*:
        exclude: true

    APS_ANALYTICS_OS_NAME:
        exclude: true # conflicts as defined in multiple places
    APS_ANALYTICS_(.*):
        class: APSAnalytics
        name: '#{g[0]}'
    kAmazon(.*):
        class: DTBErrorCodes
        name: '#{g[0]}'
    APS_(SIZE_MAX|BANNER_WIDTH|BANNER_HEIGHT|MREC_WIDTH|MREC_HEIGHT|LEADERBOARD_WIDTH|LEADERBOARD_HEIGHT|INSTREAM_VIDEO_DEFAULT_WIDTH|INSTREAM_VIDEO_DEFAULT_HEIGHT):
        class: APSAdFormat
        name: '#{g[0]}'
    (A9_BID_ID_KEY|A9_HOST_KEY|A9_PRICE_POINTS_KEY|A9_VID_KEY|A9_SKADN_KEY|APS_VIDEO_FLAG|APS_VIDEO_TYPE|APS_VIDEO_SKIP_AFTER|APS_APP_KEY):
        class: DTBAdLoader
        static_class: Constants
        name: '#{g[0]}'
    (AMAZON_.*_RESPONSE):
        class: APSAd
    APS_NETWORK_KEY:
        class: APSAd
    (DTB_VIDEO_.*):
        class: DTBAdSize
    (INTEGRATED_OM_VERSION|DEFAULT_OMSDK_PARTNER_NAME|OM_SDK_PARTNER_KEY_NAME|OM_SDK_PARTNER_VERSION_KEY_NAME):
        class: APSOmSdkHelper
    (BID_INFO|PLACEMENT_HINT|AMAZON_SLOTS|AMAZON_AD_INFO|EVENT_SERVER_PARAMETER|LOAD_START_TIME|EXPECTED_WIDTH|EXPECTED_HEIGHT|SKADNETWORK_PARAMS|CLICKTRACKERS_ARRAY|IS_VIDEO):
        class: DTBMediationConstants
    (APS_ADMOB_CONST_.*):
        class: DTBAdHelper
    (APS_AAX_PRICE_POINT_LENGTH|COMPARE_LESS_THAN_OR_EQUAL_TO|COMPARE_GREATER_THAN_OR_EQUAL_TO|COMPARE_EQUAL_TO):
        class: DTBAdHelper
    DEFAULT_ADMOB_AUTO_REFRESH_TIME_IN_SEC:
        class: APSCacheData


    # Make sure we don't miss any constants if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Constant__#{g[0]}'
