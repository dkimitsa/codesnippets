    # ecom release catch
    EOS_Ecom_Transaction_Release:
        class: EOS_Ecom_TransactionHandle
        name: 'Release'
    EOS_Ecom_(.*)_Release:
        class: 'EOS_Ecom_#{g[0]}'
        name: 'Release'
    EOS_Ecom_(.*):
        class: EOS_EcomHandle
        name: '#{g[0]}'

    EOS_Leaderboards_LeaderboardDefinition_Release:
        exclude: true # as deprecated

    # release with Handle suffix pattern
    (EOS_ActiveSession|EOS_LobbyDetails|EOS_LobbyModification|EOS_LobbySearch|EOS_PlayerDataStorageFileTransferRequest)_Release:
        class: '#{g[0]}Handle'
        name: Release
    (EOS_PresenceModification|EOS_SessionDetails|EOS_SessionModification|EOS_SessionSearch|EOS_TitleStorageFileTransferRequest)_Release:
        class: '#{g[0]}Handle'
        name: Release

    # generic release pattern should be last, verify result, make sure it
    # doesn't create new classes just for *_Release method
    (.*)_Release:
        class: '#{g[0]}'
        name: Release

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Function_#{g[0]}'

values:
    # Make sure we don't miss any values if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Value_#{g[0]}'

constants:
    EOS_(.*):
        class: EOS_Consts

    SWIFT_(.*):
        exclude: true

    # Make sure we don't miss any values if new ones are introduced in a later version
    (.*):
