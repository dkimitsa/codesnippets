package: org.robovm.pods.bitlabs
include: [foundation, uikit, coreanimation]
clang_args: ['-x', 'objective-c']
framework: BitLabs
headers:
    - BitLabs-umbrella.h
    - BitLabs-Swift.h

typedefs:

private_typedefs:

enums:

classes:
    BitLabs:
        methods:
            '-configureWithToken:uid:':
                name: configure
            '-addTagWithKey:value:':
                name: addTag
            '-launchOfferWallWithParent:':
                name: launchOfferWall
    GetLeaderboardResponse: { }
    Survey:
        methods:
            '-openWithParent:':
                name: open
    WidgetView: { }

protocols:

functions:

    # Make sure we don't miss any functions if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Function_#{g[0]}'

values:
    BitLabsVersionNumber:
        readonly: true
        class: BitLabs
        name: getVersionNumber
    BitLabsVersionString:
        readonly: true
        class: BitLabs
        name: getVersionString
        marshaler: StringMarshalers.AsAsciiZMarshaler
        type: String


    # Make sure we don't miss any values if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Value_#{g[0]}'

constants:
    SWIFT_.*:
        exclude: true

    # Make sure we don't miss any constants if new ones are introduced in a later version
    (.*):
        class: __FixMe
        name: 'Constant__#{g[0]}'
